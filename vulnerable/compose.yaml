name: obscura-vulnerable

services:
  web:
    build: .
    ports:
      - "127.0.0.1:8081:80"
    environment:
      DB_HOST: db
      DB_NAME: obscura
      DB_USER: obscura
      DB_PASSWORD: obscura_local
    depends_on:
      db:
        condition: service_healthy

  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: obscura
      MYSQL_USER: obscura
      MYSQL_PASSWORD: obscura_local
      MYSQL_ROOT_PASSWORD: root_local
    volumes:
      - db_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 30s

volumes:
  db_data: